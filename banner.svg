<svg width="900" height="200" viewBox="0 0 900 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="40%" style="stop-color:#0f1b35"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#70a5fd;stop-opacity:0.7"/>
      <stop offset="50%" style="stop-color:#bf91f3;stop-opacity:0.7"/>
      <stop offset="100%" style="stop-color:#38bdae;stop-opacity:0.7"/>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#70a5fd"/>
      <stop offset="50%" style="stop-color:#bf91f3"/>
      <stop offset="100%" style="stop-color:#38bdae"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="200" fill="url(#bgGrad)"/>

  <!-- Top wave -->
  <path d="M0,60 C150,20 300,80 450,50 C600,20 750,70 900,40 L900,0 L0,0 Z" fill="url(#waveGrad)" opacity="0.4"/>
  <path d="M0,80 C180,40 360,90 540,60 C720,30 810,75 900,55 L900,0 L0,0 Z" fill="url(#waveGrad)" opacity="0.2"/>

  <!-- Bottom wave -->
  <path d="M0,150 C150,170 300,140 450,160 C600,180 750,145 900,165 L900,200 L0,200 Z" fill="url(#waveGrad)" opacity="0.4"/>
  <path d="M0,165 C200,145 400,175 600,155 C750,140 850,168 900,158 L900,200 L0,200 Z" fill="url(#waveGrad)" opacity="0.2"/>

  <!-- Decorative dots -->
  <circle cx="50" cy="100" r="2" fill="#70a5fd" opacity="0.5"/>
  <circle cx="100" cy="70" r="1.5" fill="#bf91f3" opacity="0.4"/>
  <circle cx="820" cy="80" r="2" fill="#38bdae" opacity="0.5"/>
  <circle cx="860" cy="120" r="1.5" fill="#70a5fd" opacity="0.4"/>
  <circle cx="780" cy="60" r="1" fill="#bf91f3" opacity="0.3"/>
  <circle cx="130" cy="140" r="1.5" fill="#38bdae" opacity="0.4"/>

  <!-- Name text -->
  <text x="450" y="105" font-family="'Segoe UI', Arial, sans-serif" font-size="44" font-weight="700"
        text-anchor="middle" fill="url(#textGrad)" letter-spacing="2">
    Poornimaa Devi L
  </text>

  <!-- Tagline -->
  <text x="450" y="145" font-family="'Segoe UI', Arial, sans-serif" font-size="15" font-weight="400"
        text-anchor="middle" fill="#c9d1d9" letter-spacing="1" opacity="0.85">
    ☁️ Cloud  |  ⚙️ Backend  |  🌐 Full-Stack Developer  |  Azure &amp; AWS Certified
  </text>
</svg>
